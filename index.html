<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX FINAL - 2 TABS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050508;color:white;font-family:Arial;padding-bottom:65px;overflow-x:hidden}
.header{background:#12121f;padding:12px;display:flex;justify-content:space-between;align-items:center}
.real-on{background:#ffcc00;color:black;padding:6px 14px;border:0;border-radius:15px;font-weight:900;font-size:11px}.off{background:#222;color:#888;padding:6px 14px;border:0;border-radius:15px;font-size:11px}
#game{height:48vh;background:#050508;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#mult{font-size:85px;font-weight:900;color:#ffcc00;z-index:10;text-shadow:0 0 30px #ffcc00;font-family:monospace}
#codes{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.35}
.code{position:absolute;color:#ffcc00;font-size:13px;font-weight:700;animation:moveUp linear forwards;font-family:monospace}
@keyframes moveUp{0%{transform:translateY(50vh);opacity:0}15%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
#timer{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#ffcc00;color:black;padding:8px 22px;border-radius:20px;font-weight:900;font-size:20px;z-index:20}
.bet-panel{display:flex;gap:8px;padding:8px;background:#151525;margin:6px 8px;border-radius:14px;border:1px solid #222}
.bet-panel input{width:75px;background:#050508;border:1px solid #333;color:#ffcc00;border-radius:10px;padding:12px;text-align:center;font-weight:900;font-size:14px}
.bet-btn{flex:1;padding:14px;border:0;border-radius:12px;font-weight:900;font-size:15px}
.tab{display:none}.tab.active{display:block}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#12121f;display:flex;border-top:1px solid #333;height:60px}
.bottom button{flex:1;background:0;border:0;color:#888;padding:8px;font-size:11px;font-weight:700}
.bottom button.active{color:#ffcc00;border-top:3px solid #ffcc00}
</style>
</head>
<body>
<div class="header">
  <b style="color:#ffcc00">CODE CRASH</b>
  <div style="display:flex;gap:4px"><button id="rBtn" class="real-on" onclick="setAcc('real')">REAL</button><button id="dBtn" class="off" onclick="setAcc('demo')">DEMO</button></div>
  <b id="bal" style="color:#ffcc00">KSh 500</b>
</div>

<!-- MARKET TAB ONLY -->
<div id="tab-market" class="tab active">
  <div id="game">
    <div id="codes"></div>
    <div id="timer">5.0s</div>
    <div id="mult">1.00x</div>
  </div>
  <div style="text-align:center;padding:7px;font-size:13px;background:#0f0f1a;color:#aaa" id="status">⏳ Place 3 bets - 5 seconds!</div>

  <div class="bet-panel">
    <input id="stake1" value="100" type="number">
    <button id="btn1" class="bet-btn" style="background:#ffcc00;color:black" onclick="bet(1)">BET 1</button>
  </div>
  <div class="bet-panel">
    <input id="stake2" value="200" type="number">
    <button id="btn2" class="bet-btn" style="background:#ffcc00;color:black" onclick="bet(2)">BET 2</button>
  </div>
  <div class="bet-panel">
    <input id="stake3" value="500" type="number">
    <button id="btn3" class="bet-btn" style="background:#ffcc00;color:black" onclick="bet(3)">BET 3</button>
  </div>

  <div style="padding:8px;display:flex;gap:5px;overflow-x:auto" id="history"></div>
</div>

<!-- ACCOUNT TAB ONLY -->
<div id="tab-account" class="tab">
  <div style="background:#151525;margin:10px;border-radius:16px;padding:20px;text-align:center;border:1px solid #222">
    <small style="color:#888">REAL ACCOUNT</small>
    <h1 id="bigBal" style="color:#ffcc00;margin:10px 0;font-size:36px">KSh 500</h1>
    <div style="display:flex;gap:8px">
      <button class="bet-btn" style="background:#ffcc00;color:black" onclick="deposit()">DEPOSIT</button>
      <button class="bet-btn" style="background:#222;color:white" onclick="withdraw()">WITHDRAW</button>
    </div>
  </div>
  <div style="background:#151525;margin:10px;border-radius:12px;padding:12px;display:flex;justify-content:space-between">
    <span>Real Balance</span><b id="realB">KSh 500</b>
  </div>
  <div style="background:#151525;margin:10px;border-radius:12px;padding:12px;display:flex;justify-content:space-between">
    <span>Demo Balance</span><b id="demoB">KSh 10,000</b>
  </div>
  <div style="background:#2a1a00;margin:10px;border-radius:12px;padding:12px;border:1px solid #ffcc00">
    <small>My Profit (Admin)</small><br>
    <b id="adminP" style="color:#ffcc00;font-size:20px">KSh 0</b>
  </div>
  <div style="padding:10px;font-size:12px;color:#666">
    Till Number: <span id="till">Not set</span>
  </div>
</div>

<div class="bottom">
  <button id="b-market" class="active" onclick="showTab('market')">💻<br>MARKET</button>
  <button id="b-account" onclick="showTab('account')">👤<br>ACCOUNT</button>
</div>

<script>
let acc={real:500,demo:10000}, active='real', myProfit=0, mult=1, bets=[null,null,null], phase='betting', countdown=5, hist=[2.3,1.1,4.5,12.2,1.02], codeInt;
function setAcc(t){active=t; document.getElementById('rBtn').className=t=='real'?'real-on':'off'; document.getElementById('dBtn').className=t=='demo'?'real-on':'off'; if(t=='demo'){document.getElementById('rBtn').className='off'; document.getElementById('dBtn').style.background='#00c853'; document.getElementById('dBtn').style.color='white';}else{document.getElementById('dBtn').className='off'; document.getElementById('rBtn').style.background='#ffcc00';} updateBal();}
function updateBal(){document.getElementById('bal').innerText='KSh '+Math.floor(acc[active]); document.getElementById('bigBal').innerText='KSh '+Math.floor(acc[active]); document.getElementById('realB').innerText='KSh '+acc.real; document.getElementById('demoB').innerText='KSh '+acc.demo; document.getElementById('adminP').innerText='KSh '+Math.floor(myProfit);}
function showTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active')); document.getElementById('tab-'+n).classList.add('active'); document.getElementById('b-'+n).classList.add('active');}
function updateHist(){document.getElementById('history').innerHTML=hist.slice(-15).map(x=>`<span style="padding:5px 10px;border-radius:15px;background:${x<2?'#333':x<10?'#664d00':'#ffcc00'};color:${x>=10?'black':'white'};font-size:11px">${x.toFixed(2)}x</span>`).join('');}

function startCodes(){
  const c=document.getElementById('codes');
  codeInt=setInterval(()=>{
    let el=document.createElement('div'); el.className='code';
    el.style.left=Math.random()*92+'%'; el.style.animationDuration=(2+Math.random()*2.5)+'s';
    let arr=['1.23x','2.01x','5.44x','10x','1.05x','3.7x','BTC','KSh','100x','2.5x','WIN','0xA1','$$$','CODE'];
    el.innerText=arr[Math.floor(Math.random()*arr.length)];
    c.appendChild(el); setTimeout(()=>el.remove(),4000);
  },130);
}
function stopCodes(){clearInterval(codeInt); document.getElementById('codes').innerHTML='';}

function startBetting(){
  phase='betting'; countdown=5; mult=1; bets=[null,null,null];
  document.getElementById('mult').innerText='1.00x'; document.getElementById('mult').style.color='#ffcc00'; document.getElementById('mult').style.fontSize='85px';
  stopCodes(); startCodes();
  [1,2,3].forEach(i=>{document.getElementById('btn'+i).innerText='BET '+i; document.getElementById('btn'+i).style.background='#ffcc00'; document.getElementById('btn'+i).style.color='black'; document.getElementById('btn'+i).disabled=false;});
  let t=setInterval(()=>{
    countdown-=0.1; document.getElementById('timer').innerText=countdown.toFixed(1)+'s'; document.getElementById('timer').style.display='block';
    if(countdown<=0){clearInterval(t); document.getElementById('timer').style.display='none'; startCodesUp();}
  },100);
}

function startCodesUp(){
  phase='flying'; document.getElementById('status').innerText='🚀 Running - Cashout now!';
  let crashPoint=active=='demo'?Math.random()*8+2:Math.random()<0.65?Math.random()*1.3+1:Math.random()*12+2;
  let speed=0.02;
  let fly=setInterval(()=>{
    mult+=speed; speed+=0.0015+mult*0.0006;
    document.getElementById('mult').innerText=mult.toFixed(2)+'x';
    document.getElementById('mult').style.fontSize=(65+mult*1.5)+'px';
    if(mult>4) document.getElementById('mult').style.color='#ffaa00';
    if(mult>8) document.getElementById('mult').style.color='#ff6600';
    bets.forEach((b,idx)=>{if(b){document.getElementById('btn'+(idx+1)).innerText='CASHOUT '+(b.amount*mult).toFixed(0); document.getElementById('btn'+(idx+1)).style.background='#00ff88'; document.getElementById('btn'+(idx+1)).style.color='black';}});
    if(mult>=crashPoint){
      clearInterval(fly); stopCodes();
      document.getElementById('mult').innerText='CRASHED '+mult.toFixed(2)+'x'; document.getElementById('mult').style.color='#ff1744'; document.getElementById('mult').style.fontSize='38px';
      hist.push(mult); updateHist();
      bets.forEach((b,idx)=>{if(b){if(active=='real') myProfit+=b.amount; document.getElementById('btn'+(idx+1)).innerText='LOST'; document.getElementById('btn'+(idx+1)).style.background='#ff1744'; document.getElementById('btn'+(idx+1)).style.color='white';}});
      document.getElementById('status').innerText='💥 Crashed @ '+crashPoint.toFixed(2)+'x - Next in 3s'; updateBal();
      setTimeout(startBetting,3000);
    }
  },80);
}

function bet(slot){
  let i=slot-1;
  if(phase=='betting'){
    if(bets[i]) return; let amt=parseInt(document.getElementById('stake'+slot).value);
    if(acc[active]<amt){alert('Low balance - Go ACCOUNT'); showTab('account'); return;}
    acc[active]-=amt; bets[i]={amount:amt}; updateBal();
    document.getElementById('btn'+slot).innerText='PLACED ✓ KSh '+amt; document.getElementById('btn'+slot).style.background='#00c853'; document.getElementById('btn'+slot).style.color='white';
  }else if(phase=='flying' && bets[i]){
    let win=bets[i].amount*mult; acc[active]+=win;
    document.getElementById('btn'+slot).innerText='WON KSh '+Math.floor(win); document.getElementById('btn'+slot).style.background='#00c853'; document.getElementById('btn'+slot).disabled=true; bets[i]=null; updateBal();
  }
}
function deposit(){let till=prompt('Enter YOUR Till Number:'); if(till){document.getElementById('till').innerText=till; acc.real+=1000; updateBal(); alert('Till '+till+' saved');}}
function withdraw(){alert('Withdraw manual via M-PESA');}
updateBal(); updateHist(); startBetting();
</script>
</body>
</html>
